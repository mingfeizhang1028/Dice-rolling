<!doctype html>
<html lang="zh-CN" data-theme="darkroom" data-scheme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="骰子" />
  <title>骰子</title>

  <!--
    favicon 内联成 data URI，不放独立文件。两个理由：
    ① 不这么做浏览器每次都会去要 /favicon.ico，404 一条 —— 于是
       "控制台无错误"这条验收标准永远不成立，真错误混在里面看不见；
    ② 它是首屏请求之一，内联省掉一次往返，且天然离线可用。
    P3 做 PWA 时会补真正的一套图标（180/192/512），那时这个仍留作兜底。
  -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d0f'/%3E%3Crect x='6' y='6' width='20' height='20' rx='4' fill='%237fd6b5'/%3E%3Ccircle cx='12' cy='12' r='2.1' fill='%230d3b2e'/%3E%3Ccircle cx='20' cy='12' r='2.1' fill='%230d3b2e'/%3E%3Ccircle cx='16' cy='16' r='2.1' fill='%230d3b2e'/%3E%3Ccircle cx='12' cy='20' r='2.1' fill='%230d3b2e'/%3E%3Ccircle cx='20' cy='20' r='2.1' fill='%230d3b2e'/%3E%3C/svg%3E" />

  <link rel="stylesheet" href="/src/ui/styles.css" />
</head>
<body>
  <canvas id="stage"></canvas>

  <!-- 首屏解锁层：音频解锁 / 运动授权 / 震动探针都要用户手势，一次点击拿齐 -->
  <div id="gate" class="gate">
    <button id="start" class="start-btn" type="button">开始</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
